[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# 화관법 제품 노선 자동 제출 — UTC 22:30 = KST 익일 07:30, UTC 일~목 = KST 월~금.
# 요일 규칙(월~목 D+3, 금 D+3~5, 주말 스킵 — PM 8/11 정정)은 함수 내부에서 KST로 재계산(이중 방어).
[functions."gw-hwakwan-cron"]
  schedule = "30 22 * * 0-4"

# 올바로 일일운반일지 자동 수집 — UTC 23:00 = KST 익일 08:00, 매일(주말 포함).
# 수집 창은 오늘(KST) 포함 최근 7일: 처리자 인수 등록이 며칠 늦게 올라와 과거 집계가
# 뒤늦게 바뀌므로 창을 두고 매일 덮어쓴다(대상일 계산은 함수 내부에서 KST 기준으로).
[functions."gw-allbaro-cron"]
  schedule = "0 23 * * *"

# 정적 파일은 그대로 서빙, /.netlify/functions/* 는 서버리스 함수로.

# 진척도 벽지·위젯 — 캐시 금지.
# 배경(2026-08-25 실사고): 벽지가 90초마다 스스로 새로고침하는데도 화면이 몇 시간 전 판에
# 머물렀다. 서버는 최신을 주고 있었고(실측), Lively 웹뷰가 자기 캐시에서 옛 판을 꺼내 쓴 것.
# max-age=0,must-revalidate로는 임베디드 브라우저가 재검증을 건너뛰는 경우가 있어 no-store로 못박는다.
[[headers]]
  for = "/w/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    Pragma = "no-cache"
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"

# 진척도 본문·함수 소스의 정적 노출 차단(2026-09-03): publish="."라 /netlify/functions/*.js·_lib/*.json이 그대로 열렸다(실측 200).
# 재작성은 경로를 문자 그대로 비교해 /NETLIFY/… 같은 변형을 못 막는다(9/3 실측: 정적 서빙은 대소문자·중복 슬래시 무시).
# 1차 방어 = netlify/edge-functions/guard.ts(경로 정규화 후 404, 아래 [[edge_functions]]), 이 규칙은 2중 방어. 앱은 /.netlify/functions/* 만 호출하므로 무영향.
[[redirects]]
  from = "/netlify/*"
  to = "/.netlify/functions/gw-progress"
  status = 200
  force = true

# 정적 노출 가드(Edge, 2026-09-03) — 모든 요청에서 경로를 정규화해 /netlify/*·/tools/*·*.md·package*.json을 404로 끊는다.
# 통과: index.html·sw.js·manifest·아이콘·/w/*·/data/duties_seed.json·/.netlify/functions/*. 가드 예외 시 통과(앱을 막지 않음).
[[edge_functions]]
  path = "/*"
  function = "guard"
