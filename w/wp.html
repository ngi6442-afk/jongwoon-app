<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>진척도</title>
<meta name="robots" content="noindex,nofollow">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%}
body{font-family:'Malgun Gothic','맑은 고딕',sans-serif;background:#15171b;color:#e8e8e4;overflow:hidden}
#panel{position:absolute;right:60px;top:34vh;width:560px;max-height:62vh;background:#1f2026;
       border:1px solid #30323a;border-radius:14px;padding:26px 30px;overflow:hidden}
@media (max-width:1100px){#panel{right:4vw;width:60vw;min-width:420px}}
.hero{font-size:44px;font-weight:700;letter-spacing:-.02em}
.hero small{font-size:12px;font-weight:400;color:#96968f;margin-left:10px}
.row{color:#96968f;margin:12px 0;font-size:13px;display:flex;align-items:center;gap:10px}
.row b{color:#e8e8e4;font-weight:400;width:64px;flex:none}
.track{background:#30323a;border-radius:4px;height:9px;flex:1;overflow:hidden}
.fillb{height:9px;border-radius:4px;background:#EF9F27}
.fillb.t{background:#1D9E75}.fillb.c{background:#D85A30}
.pv{width:26px;text-align:right;font-weight:700;font-size:13px;flex:none}
hr{border:0;border-top:1px solid #30323a;margin:14px 0}
h2{font-size:12px;color:#96968f;margin-bottom:9px}
.item{display:flex;gap:9px;align-items:baseline;font-size:12px;color:#96968f;margin:7px 0}
.item .m{color:#696964}
.item.now{background:#3a3019;border-radius:6px;padding:6px 9px;color:#e8e8e4;font-weight:700}
.item.now .m{color:#EF9F27}
.foot{font-size:11px;color:#55554f;margin-top:12px}
.err{color:#c8795a;font-size:12px;margin-top:12px}
</style></head><body>
<div id="panel">
  <div class="hero"><span id="pct">—%</span><small id="stamp">불러오는 중…</small></div>
  <div id="rows"></div>
  <hr>
  <h2>지금 중요한 순서</h2>
  <div id="todos"></div>
  <div class="foot">90초마다 자동 갱신 · 상세는 폰/브라우저 진척도에서</div>
  <div class="err" id="err" style="display:none"></div>
</div>
<script>
var JSON_URL = '1742808500e3b20c47228cbb927eb672.json';
function tone(v){ return v>=85?'t':(v>=50?'':'c'); }
function pcol(v){ return v>=85?'#1D9E75':(v>=50?'#EF9F27':'#D85A30'); }
function esc(s){ return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}); }
function load(){
  fetch(JSON_URL + '?t=' + Date.now(), {cache:'no-store'}).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.json();
  }).then(function(d){
    document.getElementById('err').style.display='none';
    document.getElementById('pct').textContent = d.overall + '%';
    document.getElementById('stamp').textContent = (d.updated||'').slice(5) + ' 기준 · 큰틀 4개 평균';
    var rows='';
    (d.blocks||[]).forEach(function(b){
      var w=Math.min(100,Math.max(0,b.v));
      rows += '<div class="row"><b>'+esc(b.k)+'</b><div class="track">'
        + '<div class="fillb '+tone(b.v)+'" style="width:'+w+'%"></div></div>'
        + '<span class="pv" style="color:'+pcol(b.v)+'">'+b.v+'</span></div>';
    });
    document.getElementById('rows').innerHTML = rows;
    var todos='';
    (d.todos||[]).forEach(function(t,i){
      todos += i===0
        ? '<div class="item now"><span class="m">&#9654;</span>'+esc(t)+'</div>'
        : '<div class="item"><span class="m">&#9633;</span>'+esc(t)+'</div>';
    });
    document.getElementById('todos').innerHTML = todos;
  }).catch(function(e){
    var el=document.getElementById('err');
    el.style.display='block';
    el.textContent='갱신 실패('+e.message+') — 마지막 값 표시 중';
  });
}
load();
setInterval(load, 90000);
</script>
</body></html>
